<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Spadae | Arte della Scherma Rinascimentale</title>
    <link rel="icon" type="image/png" href="public/logo-codex-spadae.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#cca352">
    <link rel="apple-touch-icon" href="public/logo-codex-spadae.png">
    <!-- Vue 3 & Vue Router -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>

    <!-- Google Fonts: Cinzel Decorative per i titoli, Lora per il corpo testuale -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app"></div>

    <!-- Application scripts -->
    <!-- Define data first -->
    <script src="js/data/glossary.js"></script>
    <script src="js/data/books.js"></script>

    <!-- Vue Components -->
    <script src="js/components/Tooltip.js"></script>
    <script src="js/components/Home.js"></script>
    <script src="js/components/Biografia.js"></script>
    <script src="js/components/SdS.js"></script>
    <script src="js/components/Equipaggiamento.js"></script>
    <script src="js/components/Passeggio.js"></script>
    <script src="js/components/BookView.js"></script>
    <script src="js/components/OperaNova.js"></script>
    <script src="js/components/LetturaPDF.js"></script>
    <script src="js/components/Strumenti.js"></script>

    <!-- Main Application setup -->
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            // Flag per evitare reload multipli
            let refreshing = false;

            // Quando un nuovo SW prende il controllo → reload una sola volta
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    console.log('[App] Nuovo Service Worker attivo — ricarico la pagina');
                    window.location.reload();
                }
            });

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('[App] SW registrato:', registration);

                    // Controlla aggiornamenti ogni 60 secondi
                    setInterval(() => registration.update(), 60 * 1000);

                    // Se c'è già un worker in attesa, inviagli SKIP_WAITING
                    if (registration.waiting) {
                        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }

                    // Intercetta aggiornamenti futuri
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        console.log('[App] Nuovo SW trovato, stato:', newWorker.state);

                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // Nuovo SW installato mentre uno vecchio è già attivo → forza skip
                                console.log('[App] Nuovo SW installato — invio SKIP_WAITING');
                                newWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                }).catch(err => {
                    console.error('[App] Registrazione SW fallita:', err);
                });
            });
        }
    </script>
</body>

</html>
